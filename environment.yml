name: financepy
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.11

  # Core data science stack
  - pandas>=2.2.0       # Data manipulation and analysis
  - numpy>=2.0          # Numerical computing, linear algebra
  - scipy>=1.11         # Scientific computing (used implicitly by indicators)

  # Data sourcing
  - yfinance>=0.2.32    # Yahoo Finance data downloader

  # Configuration
  - pyyaml>=6.0         # YAML parser for config files

  # Visualization & Dashboard
  - plotly>=5.17        # Interactive plots and visualizations
  - streamlit>=1.28     # Web application framework for dashboards

  # Development & Testing
  - pytest>=7.4         # Testing framework
  - pytest-cov>=4.1     # Code coverage for tests

  # Development tools (optional but recommended)
  - black>=23.0         # Code formatter
  - ruff>=0.1           # Fast linter
  - mypy>=1.0           # Static type checker

  # Utilities
  - pip                 # Package installer

# This environment.yml file was generated for FinancePy
#
# INSTALLATION:
#   conda env create -f environment.yml
#   conda activate financepy
#
# ALTERNATE (Fast setup with conda-forge):
#   conda create -n financepy -c conda-forge python=3.11 pandas numpy scipy \
#     yfinance pyyaml plotly streamlit pytest pytest-cov
#
# UPDATE all packages:
#   conda update -n financepy --all
#
# REMOVE environment:
#   conda remove -n financepy --all
#
